name: RepoSherlock CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "member*/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reposherlock-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate RepoSherlock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --include=optional

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Frontend build
        run: npm run build

      - name: Lambda build
        run: npm run build:aws

      - name: Check generated Lambda package
        shell: bash
        run: |
          test -f dist-lambda/index.mjs
          test -f dist-lambda/nitro.json || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



