AWSTemplateFormatVersion: "2010-09-09"
Description: RepoSherlock MVP AWS foundation. No application code or integrations are deployed.

Parameters:
  ProjectName:
    Type: String
    Default: reposherlock
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  BedrockModelArns:
    Type: CommaDelimitedList
    Default: "arn:aws:bedrock:ap-south-1::foundation-model/nvidia.nemotron-nano-12b-v2"
    Description: Comma-separated foundation model ARNs allowed for bedrock:InvokeModel; must match the runtime model id.
  BedrockRoleArn:
    Type: String
    Default: "arn:aws:iam::343218215737:role/RepoSherlockBedrockRole"
    Description: >-
      Cross-account role in the Bedrock account assumed by the Lambda to invoke
      the runtime model. Only this exact role may be assumed.
  GitHubSecretName:
    Type: String
    Default: reposherlock/github
    AllowedPattern: "^[a-zA-Z0-9/_+=.@-]{1,512}$"
  ArtifactsBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional globally unique S3 bucket name. Leave empty to let CloudFormation generate one.
  FrontendBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional globally unique S3 bucket for the built frontend assets. Leave empty to let CloudFormation generate one.

Conditions:
  HasArtifactsBucketName: !Not [!Equals [!Ref ArtifactsBucketName, ""]]
  HasFrontendBucketName: !Not [!Equals [!Ref FrontendBucketName, ""]]

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasArtifactsBucketName, !Ref ArtifactsBucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
        
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasFrontendBucketName, !Ref FrontendBucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  InvestigationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  GitHubSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref GitHubSecretName
      Description: RepoSherlock GitHub integration secret. Populate manually; no token is deployed by this stack.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${EnvironmentName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvironmentName}-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RepoSherlockRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactsBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - repositories/*
              - Sid: ArtifactsObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ArtifactsBucket.Arn}/repositories/*
              - Sid: InvestigationsTableAccess
                Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt InvestigationsTable.Arn
                  - !Sub ${InvestigationsTable.Arn}/index/*
              - Sid: GitHubSecretRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GitHubSecret
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArns
              - Sid: BedrockRoleAssumption
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref BedrockRoleArn
              - Sid: AsyncSelfInvocation
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${EnvironmentName}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvironmentName}-apigateway-logs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiGatewayAccount:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}
      ProtocolType: HTTP
      Description: RepoSherlock MVP API front door; integrations are intentionally not deployed.
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  ApiGatewayStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGatewayAccount
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","responseLatency":"$context.responseLatency"}'

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  InvestigationsTableName:
    Value: !Ref InvestigationsTable
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  GitHubSecretArn:
    Value: !Ref GitHubSecret
  ApiId:
    Value: !Ref ApiGatewayAccount
  ApiEndpoint:
    Value: !Sub https://${ApiGatewayAccount}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FrontendBucketName:
    Value: !Ref FrontendBucket
    Description: S3 bucket for the built frontend assets, served by CloudFront.
  Region:
    Value: !Ref AWS::Region
    Description: Region this foundation stack was deployed into.
